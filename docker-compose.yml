version: '3.8'

networks:
  banking-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Keycloak Identity and Access Management
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: banking-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_PROXY: edge
    volumes:
      - ./keycloak/banking-realm.json:/opt/keycloak/data/import/banking-realm.json:ro
    networks:
      - banking-network
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Spring Boot Backend API
  backend:
    build:
      context: ./Bank backend
      dockerfile: Dockerfile
    container_name: banking-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bankdb
      DB_USER: postgres
      DB_PASSWORD: "1234"
      KEYCLOAK_ISSUER_URI: http://localhost:8080/auth/realms/banking-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/banking-realm/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    networks:
      - banking-network
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # 4. Frontend Application
  frontend:
    build:
      context: ./banking-frontend
      dockerfile: Dockerfile
    container_name: banking-frontend
    restart: unless-stopped
    networks:
      - banking-network

  # 5. Nginx API Gateway & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: banking-nginx-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - banking-network
    depends_on:
      - frontend
      - backend
      - keycloak
